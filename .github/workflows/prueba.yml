name: prueba comparar tokens

on:
  push:

jobs:
  verificar-token:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN y LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          LOCAL_DEV_TOKEN: ${{ vars.LOCAL_DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden"
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
