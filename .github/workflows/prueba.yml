name: prueba comparar tokens

on:
  push:

jobs:
    verificar-token:
      runs-on: self-hosted

      steps:
        - name: Comparar DEV_TOKEN y LOCAL_DEV_TOKEN
          env:
           DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
           LOCAL_DEV_TOKEN: ${{ vars.LOCAL_DEV_TOKEN }}
          run: |
             if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
               echo "✅ Los tokens coinciden"
             else
               echo "❌ Los tokens NO coinciden"
             fi
    