name: CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  actualizar-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Incrementar versión
        run: |
          echo "AppVersion-2 $(date)" >> README.md

      - name: Mostrar README
        run: cat README.md

  validar-token:
    needs: actualizar-version
    runs-on: self-hosted

    steps:
      - name: Comparar PROD_TOKEN y LOCAL_PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
